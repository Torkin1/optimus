services:
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DELUGE_LOGLEVEL=error #optional
    volumes:
      - deluge_config:/config
      - /mnt/HGST/library:/downloads:z
    ports:
      # - 8112:8112
      - 6881:6881
      - 6881:6881/udp
      # - 58846:58846 #optional
    restart: unless-stopped
    networks:
      - front_public


networks:
  front_internal:
    external: true
  front_public:
    external: true
  
volumes:
  deluge_config:
  deluge_downloads:
services:
  caddy:
    image: caddy:2.10.2
    security_opt:
      - label=disable 
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      # tailscale creates its socket on /tmp, so we'll kidnap from there to expose to caddy
      - /run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    networks:
      - internal
      - public
    # extra_hosts:
    # - "host.docker.internal:host-gateway"
    

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public:

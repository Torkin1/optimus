services:
  calibre-web:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web
    # ports:
      # - 8083:8083
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - CWA_PORT_OVERRIDE=8083
      # - CWA_WATCH_MODE=poll
    volumes:
      - calibre-config:/config
      - ./books:/calibre-library:rw,Z
      - ./ingest:/cwa-book-ingest:rw,Z
    restart: 'unless-stopped'
    networks:
      - front_public
networks:
  front_internal:
    external: true
  front_public:
    external: true
    
volumes:
  calibre-config:
